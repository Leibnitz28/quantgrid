name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantgrid
          POSTGRES_PASSWORD: quantgrid
          POSTGRES_DB: quantgrid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantgrid"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      QG_TEST_DATABASE_URL: postgresql+psycopg://quantgrid:quantgrid@127.0.0.1:5432/quantgrid_test
      QG_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Types
        run: .venv/bin/mypy src/quantgrid
      - name: Migrations match the models
        env:
          QG_DATABASE_URL: postgresql+psycopg://quantgrid:quantgrid@127.0.0.1:5432/quantgrid_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/alembic downgrade base
      - name: Tests
        run: .venv/bin/pytest -q

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantgrid:ci .
      - run: docker run --rm quantgrid:ci --help
