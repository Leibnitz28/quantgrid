t><text class="label" x="500.0" y="99.9">ideal 4×</text><line class="series" x1="56" x2="74" y1="64" y2="64"/><circle class="dot" cx="65" cy="64" r="4"/><text class="label" x="82" y="68">measured speedup T1/Tp (mean, min–max whiskers)</text><line class="ref" x1="386" x2="404" y1="64" y2="64"/><text class="label" x="412" y="68">ideal linear</text></svg>
