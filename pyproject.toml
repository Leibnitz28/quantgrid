[project]
name = "quantgrid"
version = "0.1.0"
description = "Fault-tolerant scheduler for reproducible quant research backtests."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Piyush Jha" }]
keywords = ["backtesting", "scheduler", "distributed-systems", "quant", "celery", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Optional real LLM provider for the planner. The default (and CI) path uses the
# deterministic FakeLLM and needs no API key.
llm = ["anthropic>=1.0"]
# Optional OTLP span exporter (default exporter is "none"; "console" needs no extra).
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.urls]
Repository = "https://github.com/Ankur17nith/quantgrid"
Changelog = "https://github.com/Ankur17nith/quantgrid/blob/main/CHANGELOG.md"

[project.scripts]
quantgrid = "quantgrid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantgrid"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4"]
ignore = [
    "S608",   # SQL is built from fixed fragments; all values are bound parameters
    "RUF012", # pydantic/sqlalchemy class attributes
    "PT018",  # composite assertions are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S101", "S603", "S607", "S311", "S105", "S106", "S108"]
"scripts/**" = ["E501", "RUF001", "RUF003", "S101", "S603", "S607", "S311", "S108"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pyarrow.*", "duckdb.*", "prometheus_client.*", "anthropic.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 600
markers = [
    "integration: needs a reachable PostgreSQL (QG_TEST_DATABASE_URL) and Redis (QG_TEST_REDIS_URL)",
    "e2e: launches real coordinator/worker processes",
    "chaos: kills or pauses worker processes (failure injection)",
    "slow: takes more than ~10 seconds",
]
